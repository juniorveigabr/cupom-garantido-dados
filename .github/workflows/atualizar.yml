name: Atualizar os dados

# Toda segunda-feira, às 6h17 de Brasília, lê o arquivo público do site e grava os arquivos de dados/.
# Também dá para rodar pelo botão "Run workflow".
on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node atualizar.mjs
      - name: Gravar, se algo mudou
        run: |
          git config user.name "Cupom Garantido"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados
          git diff --cached --quiet && echo "Nada mudou." && exit 0
          git commit -m "Dados de $(date -u +%Y-%m-%d)"
          git push
